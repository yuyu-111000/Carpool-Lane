<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>挪车！师傅 · Carpool Lane</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0B0C0A;
    --panel: #15171B;
    --board: #16181D;
    --line: rgba(255,255,255,.14);
    --amber: #FFB800;
    --red: #E5484D;
    --green: #00C853;
    --text: #F5F2EA;
    --dim: #8A8F98;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "JetBrains Mono", monospace;
    --sans: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; align-items: center;
    height: 100dvh; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .lane {
    height: 3px; width: 100%;
    background: repeating-linear-gradient(90deg, var(--amber) 0 26px, transparent 26px 42px);
    opacity: .85;
  }
  .btn {
    font-family: var(--sans); font-size: 15px; font-weight: 800; letter-spacing: 1px;
    background: transparent; color: var(--amber);
    border: 1px solid var(--amber); border-radius: 2px;
    padding: 10px 18px; cursor: pointer;
  }
  .btn:active { background: rgba(255,184,0,.15); }
  .btn.primary { background: var(--amber); color: #0B0C0A; }
  .btn.primary:active { background: #e6a600; }
  .btn.sec { color: var(--dim); border-color: var(--line); }

  /* ---------- HUD（两行网格：关卡名+按钮 / 语录+统计） ---------- */
  #hud {
    width: 100%; max-width: 600px; display: none;
    grid-template-columns: 1fr auto; grid-template-areas: "name btns" "sub stats";
    gap: 4px 10px; align-items: center;
    padding: 10px 14px; font-size: 13px;
  }
  #level-name { grid-area: name; font-weight: 800; font-size: 16px; letter-spacing: .5px; }
  .hud-btns { grid-area: btns; display: flex; gap: 8px; }
  .hud-btns .btn { padding: 7px 12px; font-size: 13px; }
  #sub { grid-area: sub; min-width: 0; }
  #quote { color: var(--dim); font-size: 12px; }
  #stats { grid-area: stats; display: flex; gap: 12px; color: var(--text); font-family: var(--mono); font-variant-numeric: tabular-nums; }
  #stats b { color: var(--amber); }
  #pickup-hint { display: none; color: var(--amber); font-size: 12px; }

  /* ---------- 棋盘 ---------- */
  #stage { position: relative; }
  #game {
    width: min(96vw, 600px, calc(100dvh - 190px));
    aspect-ratio: 1 / 1;
    border: 1px solid var(--line);
    background: var(--board);
    touch-action: none; cursor: pointer; display: block;
  }
  #hint {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
    background: rgba(11,12,10,.92); border: 1px solid var(--amber); border-radius: 2px;
    color: var(--amber); font-size: 13px; font-weight: 700; letter-spacing: 1px;
    padding: 7px 14px; display: none; pointer-events: none; white-space: nowrap;
  }
  footer { color: #4a5058; font-size: 11px; font-family: var(--mono); padding: 6px; }

  /* ---------- 遮罩层 ---------- */
  .overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: none; flex-direction: column; align-items: center;
    overflow-y: auto; padding: 28px 20px 20px; gap: 20px; text-align: center;
  }
  .overlay.dim { background: rgba(11,12,10,.9); justify-content: center; }

  /* 标题屏：路牌式刊头 */
  .sign {
    border: 2px solid var(--amber); border-radius: 4px;
    padding: 18px 34px 16px; background: var(--panel);
    box-shadow: 0 0 0 6px var(--bg), 0 0 0 7px var(--line);
  }
  .sign-top { font-family: var(--mono); color: var(--dim); font-size: 12px; letter-spacing: 4px; }
  .sign h1 { font-size: 40px; font-weight: 900; letter-spacing: 6px; margin: 6px 0 10px; }
  .sign .lane { width: 100%; }
  .sign .tag { color: var(--dim); font-size: 13px; margin-top: 10px; letter-spacing: 2px; }

  .howto { width: 100%; max-width: 560px; }
  .howto h2, .road-title {
    font-size: 14px; font-weight: 800; letter-spacing: 4px; color: var(--dim);
    text-align: left; margin-bottom: 12px;
  }
  .howto-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 520px) { .howto-grid { grid-template-columns: 1fr; } }
  .howto-item {
    border: 1px solid var(--line); background: var(--panel);
    padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; text-align: left;
  }
  .howto-item svg { width: 100%; height: 64px; background: var(--board); }
  .howto-item b { font-size: 14px; letter-spacing: 1px; }
  .howto-item span { font-size: 12px; color: var(--dim); line-height: 1.5; }

  /* 道路式关卡选择 */
  .road { width: 100%; max-width: 420px; position: relative; padding: 4px 0 8px; }
  .road::before {
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; transform: translateX(-50%);
    background: repeating-linear-gradient(180deg, var(--amber) 0 14px, transparent 14px 26px);
    opacity: .5;
  }
  .level-btn {
    position: relative; display: flex; align-items: center; gap: 12px; width: 100%;
    background: none; border: none; color: var(--text); cursor: pointer;
    padding: 9px 0; font-family: var(--sans);
  }
  .level-btn .node {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 16px; height: 16px; background: var(--bg); border: 2px solid var(--amber); z-index: 1;
  }
  .level-btn .no { width: 44%; text-align: right; font-family: var(--mono); font-size: 15px; }
  .level-btn .no b { font-size: 17px; }
  .level-btn .nm { width: 44%; margin-left: auto; text-align: left; font-size: 13px; color: var(--dim); }
  .level-btn .stars { font-size: 11px; color: var(--amber); letter-spacing: 1px; }
  .level-btn:active .node { background: var(--amber); }

  /* 胜利屏 */
  #win-screen h2 { font-size: 26px; font-weight: 900; letter-spacing: 3px; }
  #win-stars { font-size: 46px; letter-spacing: 6px; }
  #win-text { font-size: 15px; color: var(--dim); }
  #win-stats { font-family: var(--mono); font-size: 14px; color: var(--text); }
  #win-stats b { color: var(--amber); }
  .win-btns { display: flex; gap: 12px; }
</style>

<script>
'use strict';
(function(){

/* ===== src/rules/board.js ===== */
// board.js —— 棋盘与车辆状态（双端同源：Node 与浏览器共用，零 DOM 依赖）
// 一个"状态"= { cars: {id: {x,y}}, picked: [乘客id...] }
// 棋盘静态信息（尺寸/车辆形状/乘客/墙/出口）由 level 定义，只读。

function createLevel(def) {
  // def: {w,h,exit:{x,y},cars:[{id,x,y,len,dir,role,bus}],pickups:[{id,x,y,order}],walls:[{x,y}]}
  const lvl = {
    w: def.w,
    h: def.h,
    exit: { x: def.exit.x, y: def.exit.y },
    cars: def.cars.map(c => ({ ...c })),
    pickups: (def.pickups || []).map(p => ({ ...p })),
    walls: (def.walls || []).map(w => ({ ...w })),
  };
  // 派生：车辆占格集合、英雄车 id、乘客需求
  lvl.occupies = carCells;
  lvl.hero = lvl.cars.find(c => c.role === 'hero');
  if (!lvl.hero) throw new Error('level needs a hero car');
  validateNoOverlap(lvl);
  return lvl;
}

function carCells(car) {
  const cells = [];
  for (let i = 0; i < car.len; i++) {
    cells.push({
      x: car.dir === 'h' ? car.x + i : car.x,
      y: car.dir === 'v' ? car.y + i : car.y,
    });
  }
  return cells;
}

function initialState(level) {
  const cars = {};
  for (const c of level.cars) cars[c.id] = { x: c.x, y: c.y };
  return { cars, picked: [] };
}

function cloneState(s) {
  const cars = {};
  for (const id in s.cars) cars[id] = { ...s.cars[id] };
  return { cars, picked: s.picked.slice() };
}

// 状态键：用于 BFS 去重。"坐标用一位字母编码" —— 7x7 内够用（0-7）
function stateKey(level, s) {
  const parts = level.cars.map(c => {
    const p = s.cars[c.id];
    const v = c.dir === 'h' ? p.x : p.y;
    return v.toString(36);
  });
  let picked = '';
  if (level.pickups.length) {
    const mask = level.pickups.map(p => (s.picked.includes(p.id) ? '1' : '0')).join('');
    picked = '|' + mask;
  }
  return parts.join('') + picked;
}

// 占用网格：返回 Map "x,y" -> carId（只统计车身，乘客格不占）
function occupancyGrid(level, s) {
  const grid = new Map();
  for (const w of level.walls) grid.set(w.x + ',' + w.y, '#');
  for (const c of level.cars) {
    const p = s.cars[c.id];
    for (const cell of carCells({ ...c, x: p.x, y: p.y })) {
      grid.set(cell.x + ',' + cell.y, c.id);
    }
  }
  return grid;
}

function validateNoOverlap(lvl) {
  const seen = new Map();
  for (const w of lvl.walls) {
    const k = w.x + ',' + w.y;
    if (seen.has(k)) throw new Error('overlap at ' + k);
    seen.set(k, '#');
  }
  for (const c of lvl.cars) {
    for (const cell of carCells(c)) {
      if (cell.x < 0 || cell.x >= lvl.w || cell.y < 0 || cell.y >= lvl.h) {
        throw new Error('car ' + c.id + ' out of bounds');
      }
      const k = cell.x + ',' + cell.y;
      if (seen.has(k)) throw new Error('overlap at ' + k + ' (' + c.id + ')');
      seen.set(k, c.id);
    }
  }
  for (const p of lvl.pickups) {
    if (seen.has(p.x + ',' + p.y)) throw new Error('pickup inside car/wall');
  }
}

/* ===== src/rules/move.js ===== */
// move.js —— 移动规则（与求解器共用；班车同步推进在这里，单一事实源）
// "一步" = 一辆车沿其方向连续滑动任意格数（Rush Hour 惯例）


function gridWithout(level, s, excludeId) {
  const grid = new Map();
  for (const w of level.walls) grid.set(w.x + ',' + w.y, '#');
  for (const c of level.cars) {
    if (c.id === excludeId) continue;
    const p = s.cars[c.id];
    for (const cell of carCells({ ...c, x: p.x, y: p.y })) {
      grid.set(cell.x + ',' + cell.y, c.id);
    }
  }
  return grid;
}

// 枚举某辆车当前可滑到的所有目标位置（不含原地）
function slideTargets(level, s, carId) {
  const car = level.cars.find(c => c.id === carId);
  if (car.bus) return []; // 班车不可被玩家移动
  const pos = s.cars[carId];
  const grid = gridWithout(level, s, carId);
  const isH = car.dir === 'h';
  const axis = isH ? 'x' : 'y';
  const fixed = pos[isH ? 'y' : 'x'];
  const cur = pos[axis];
  const max = isH ? level.w : level.h;
  const targets = [];

  const cellsAt = t => {
    const cells = [];
    for (let i = 0; i < car.len; i++) {
      cells.push(isH ? { x: t + i, y: fixed } : { x: fixed, y: t + i });
    }
    return cells;
  };

  for (let t = cur - 1; t >= 0; t--) {
    if (cellsAt(t).some(c => grid.has(c.x + ',' + c.y))) break;
    targets.push(t);
  }
  for (let t = cur + 1; t + car.len - 1 < max; t++) {
    if (cellsAt(t).some(c => grid.has(c.x + ',' + c.y))) break;
    targets.push(t);
  }
  return targets;
}

// 执行一步：carId 滑到 axis 坐标 target，然后所有班车各走一格（被挡则停）。
// 返回新状态（不修改入参）。非法移动抛 Error。
function applyMove(level, s, carId, target) {
  const car = level.cars.find(c => c.id === carId);
  if (!car) throw new Error('no car ' + carId);
  if (car.bus) throw new Error('bus car ' + carId + ' is not movable');
  const targets = slideTargets(level, s, carId);
  if (!targets.includes(target)) throw new Error('illegal move ' + carId + '->' + target);

  const isH = car.dir === 'h';
  const next = {
    cars: { ...s.cars, [carId]: { ...s.cars[carId] } },
    picked: s.picked.slice(),
  };
  next.cars[carId][isH ? 'x' : 'y'] = target;

  // 捎人：英雄车滑完后，若车身任一格与未接乘客曼哈顿距离 1，接上它
  const hero = level.hero;
  const hp = next.cars[hero.id];
  for (const p of level.pickups) {
    if (next.picked.includes(p.id)) continue;
    if (p.order != null) {
      const pending = level.pickups
        .filter(q => !next.picked.includes(q.id))
        .sort((a, b) => a.order - b.order);
      if (pending[0].id !== p.id) continue; // 按序接送
    }
    const near = carCells({ ...hero, x: hp.x, y: hp.y }).some(
      c => Math.abs(c.x - p.x) + Math.abs(c.y - p.y) === 1
    );
    if (near) next.picked.push(p.id);
  }

  // 班车推进：每步一格，方向 bus.dx/dy；越界或被挡则停
  for (const c of level.cars) {
    if (!c.bus) continue;
    const bp = next.cars[c.id];
    const nx = bp.x + (c.bus.dx || 0);
    const ny = bp.y + (c.bus.dy || 0);
    const grid = gridWithout(level, next, c.id);
    const body = carCells({ ...c, x: nx, y: ny });
    const inBounds = body.every(b => b.x >= 0 && b.x < level.w && b.y >= 0 && b.y < level.h);
    const blocked = body.some(b => grid.has(b.x + ',' + b.y));
    if (inBounds && !blocked) next.cars[c.id] = { x: nx, y: ny };
  }
  return next;
}

// 玩家可操作的车辆（班车不可动）
function movableCars(level) {
  return level.cars.filter(c => !c.bus).map(c => c.id);
}

/* ===== src/rules/goal.js ===== */
// goal.js —— 目标谓词（游戏端与求解器共用）
// 出口 exit 定义在棋盘边界外一格（如右出口 x=w）。"道闸格" = 出口相邻的棋盘内格。
// 无乘客：英雄车身占据道闸格即胜（道闸抬起，下一步滑出棋盘是纯演出）。
// 有乘客：接齐乘客道闸才开。


function gateCell(level) {
  const gx = Math.max(0, Math.min(level.exit.x, level.w - 1));
  const gy = Math.max(0, Math.min(level.exit.y, level.h - 1));
  return { x: gx, y: gy };
}

function gateOpen(level, s) {
  return level.pickups.every(p => s.picked.includes(p.id));
}

function isWin(level, s) {
  if (!gateOpen(level, s)) return false;
  const hero = level.hero;
  const hp = s.cars[hero.id];
  const g = gateCell(level);
  return carCells({ ...hero, x: hp.x, y: hp.y }).some(c => c.x === g.x && c.y === g.y);
}

// render.js —— Canvas 渲染（原型版：棋盘/车/乘客/道闸/粒子）

const CAR_COLORS = ['#4a90d9', '#7b68ee', '#2ecc71', '#f39c12', '#e67e22', '#1abc9c', '#9b59b6', '#34495e'];

class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.particles = [];
    this.time = 0;
  }

  resize(level, dpr) {
    const cs = getComputedStyle(this.canvas);
    const cssW = parseFloat(cs.width) || 480;
    const cssH = parseFloat(cs.height) || 480;
    this.canvas.width = Math.round(cssW * dpr);
    this.canvas.height = Math.round(cssH * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.cssW = cssW;
    this.cssH = cssH;
    this.layout(level);
  }

  layout(level) {
    const margin = 12;
    // 出口开在右边界：右侧留出闸门视觉带
    const availW = this.cssW - margin * 2 - 18;
    const availH = this.cssH - margin * 2;
    this.cell = Math.floor(Math.min(availW / level.w, availH / level.h));
    this.ox = Math.round((this.cssW - 18 - this.cell * level.w) / 2);
    this.oy = Math.round((this.cssH - this.cell * level.h) / 2);
  }

  cellRect(level, x, y) {
    return { px: this.ox + x * this.cell, py: this.oy + y * this.cell, s: this.cell };
  }

  posToCell(level, clientX, clientY) {
    const rect = this.canvas.getBoundingClientRect();
    const x = Math.floor((clientX - rect.left - this.ox) / this.cell);
    const y = Math.floor((clientY - rect.top - this.oy) / this.cell);
    return { x, y, inside: x >= 0 && x < level.w && y >= 0 && y < level.h };
  }

  draw(level, state, view, dt) {
    this.time += dt;
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.cssW, this.cssH);
    this.layout(level);

    // 底盘（沥青）
    ctx.fillStyle = '#2b303b';
    ctx.fillRect(this.ox, this.oy, this.cell * level.w, this.cell * level.h);

    // 网格
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= level.w; i++) {
      ctx.beginPath();
      ctx.moveTo(this.ox + i * this.cell + 0.5, this.oy);
      ctx.lineTo(this.ox + i * this.cell + 0.5, this.oy + this.cell * level.h);
      ctx.stroke();
    }
    for (let j = 0; j <= level.h; j++) {
      ctx.beginPath();
      ctx.moveTo(this.ox, this.oy + j * this.cell + 0.5);
      ctx.lineTo(this.ox + this.cell * level.w, this.oy + j * this.cell + 0.5);
      ctx.stroke();
    }

    // 墙
    for (const w of level.walls) {
      const { px, py, s } = this.cellRect(level, w.x, w.y);
      ctx.fillStyle = '#565f6e';
      roundRect(ctx, px + 2, py + 2, s - 4, s - 4, 4);
      ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(px + 2, py + 2, s - 4, (s - 4) * 0.3);
    }

    // 出口：外侧延续路面 + 车道虚线 + 道闸
    const g = gatePos(level, this);
    this.drawExit(level, g, view.gateOpen);

    // 乘客
    for (const p of level.pickups) {
      if (state.picked.includes(p.id)) continue;
      const { px, py, s } = this.cellRect(level, p.x, p.y);
      const bob = Math.sin(this.time / 300) * 3;
      ctx.font = `${Math.floor(s * 0.62)}px "Segoe UI Emoji","Apple Color Emoji",sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🧍', px + s / 2, py + s / 2 + bob);
      // 待接光环
      ctx.strokeStyle = `rgba(255,214,64,${0.5 + 0.3 * Math.sin(this.time / 200)})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(px + s / 2, py + s / 2, s * 0.42, 0, Math.PI * 2);
      ctx.stroke();
      if (p.order != null) {
        ctx.fillStyle = '#ffd640';
        ctx.font = `bold ${Math.floor(s * 0.3)}px sans-serif`;
        ctx.fillText(String(p.order), px + s * 0.82, py + s * 0.18);
      }
    }

    // 车辆（含动画插值）
    for (const car of level.cars) {
      const pos = state.cars[car.id];
      let x = pos.x, y = pos.y;
      const anim = view.anims && view.anims[car.id];
      if (anim) {
        const t = easeOut(Math.min(1, (view.now - anim.t0) / anim.dur));
        x = anim.from.x + (pos.x - anim.from.x) * t;
        y = anim.from.y + (pos.y - anim.from.y) * t;
      }
      this.drawCar(level, car, x, y, view, state);
    }

    // 粒子
    this.updateParticles(dt);
  }

  drawCar(level, car, x, y, view, state) {
    const ctx = this.ctx;
    const isH = car.dir === 'h';
    const wpx = (isH ? car.len : 1) * this.cell - 6;
    const hpx = (isH ? 1 : car.len) * this.cell - 6;
    const px = this.ox + x * this.cell + 3;
    const py = this.oy + y * this.cell + 3;
    const hero = car.role === 'hero';
    const selected = view.selectedId === car.id;
    const bus = !!car.bus;

    // 阴影
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    roundRect(ctx, px + 2, py + 3, wpx, hpx, 8);
    ctx.fill();

    // 车身
    ctx.fillStyle = hero ? '#e74c3c' : bus ? '#f1c40f' : CAR_COLORS[(car.id.charCodeAt(0) + car.len) % CAR_COLORS.length];
    roundRect(ctx, px, py, wpx, hpx, 8);
    ctx.fill();
    if (selected) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      roundRect(ctx, px, py, wpx, hpx, 8);
      ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 2;
      roundRect(ctx, px, py, wpx, hpx, 8);
      ctx.stroke();
    }

    // 车窗（英雄车用 emoji 整车表现，不画窗块）
    if (!hero) {
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      if (isH) {
        roundRect(ctx, px + wpx * 0.55, py + hpx * 0.18, wpx * 0.22, hpx * 0.28, 3); ctx.fill();
        roundRect(ctx, px + wpx * 0.18, py + hpx * 0.18, wpx * 0.2, hpx * 0.28, 3); ctx.fill();
      } else {
        roundRect(ctx, px + wpx * 0.18, py + hpx * 0.08, wpx * 0.64, hpx * 0.12, 3); ctx.fill();
        roundRect(ctx, px + wpx * 0.18, py + hpx * 0.5, wpx * 0.64, hpx * 0.12, 3); ctx.fill();
      }
    }

    // 英雄车：师傅标识 + 已接乘客数
    if (hero) {
      ctx.font = `${Math.floor(this.cell * 0.62)}px "Segoe UI Emoji","Apple Color Emoji",sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🚕', px + wpx / 2, py + hpx / 2);
      if (level.pickups.length) {
        const n = state.picked.length;
        if (n > 0) {
          ctx.fillStyle = '#2ecc71';
          ctx.beginPath();
          ctx.arc(px + wpx - 4, py + 6, 9, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 11px sans-serif';
          ctx.fillText(String(n), px + wpx - 4, py + 7);
        }
      }
    }

    // 班车箭头
    if (bus) {
      ctx.fillStyle = '#7f6000';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      const cx = px + wpx / 2, cy = py + hpx / 2;
      ctx.fillText(arrowOf(car.bus), cx, cy + 6);
    }
  }

  // 出口：外侧延续路面 + 琥珀车道虚线 + 红白条纹道闸（停车场栏杆语义）
  drawExit(level, g, open) {
    const ctx = this.ctx;
    const roadW = this.cssW - g.px;
    // 外侧延续路面
    ctx.fillStyle = '#1d2026';
    ctx.fillRect(g.px, g.py + 3, roadW, g.s - 6);
    // 车道虚线指向外
    ctx.strokeStyle = 'rgba(255,184,0,0.75)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 5]);
    ctx.beginPath();
    ctx.moveTo(g.px + 2, g.py + g.s / 2);
    ctx.lineTo(this.cssW - 3, g.py + g.s / 2);
    ctx.stroke();
    ctx.setLineDash([]);
    // 出口标签（画布右缘对齐，避免与栏杆重叠）
    ctx.fillStyle = 'rgba(255,184,0,0.9)';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('出口', this.cssW - 4, g.py - 4);

    if (open) {
      // 抬起的栏杆：开口上方的短条纹桩 + 绿灯
      const bx = g.px + 2;
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = i % 2 ? '#fff' : '#e5484d';
        ctx.fillRect(bx, g.py - 16 + i * 4, 5, 4);
      }
      ctx.fillStyle = '#00c853';
      ctx.beginPath();
      ctx.arc(bx + 2.5, g.py + g.s - 4, 3.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // 放下的红白条纹栏杆，横跨开口
      const bx = g.px + 2;
      const seg = 6;
      for (let y = g.py + 2; y < g.py + g.s - 2; y += seg) {
        ctx.fillStyle = Math.floor((y - g.py) / seg) % 2 ? '#fff' : '#e5484d';
        ctx.fillRect(bx, y, 6, Math.min(seg, g.py + g.s - 2 - y));
      }
      ctx.fillStyle = '#e5484d';
      ctx.beginPath();
      ctx.arc(bx + 3, g.py + g.s - 4, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  burst(level, cellX, cellY, color) {
    const { px, py, s } = this.cellRect(level, cellX, cellY);
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = 60 + Math.random() * 160;
      this.particles.push({
        x: px + s / 2, y: py + s / 2,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60,
        life: 0.6 + Math.random() * 0.5, age: 0,
        color: color || (Math.random() < 0.5 ? '#ffd640' : '#e74c3c'),
        size: 3 + Math.random() * 4,
      });
    }
  }

  updateParticles(dt) {
    const ctx = this.ctx;
    const dts = dt / 1000;
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.age += dts;
      if (p.age > p.life) { this.particles.splice(i, 1); continue; }
      p.x += p.vx * dts;
      p.y += p.vy * dts;
      p.vy += 320 * dts;
      ctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }
}

function gatePos(level, r) {
  const row = level.exit.y;
  return {
    px: r.ox + level.w * r.cell + 2,
    py: r.oy + row * r.cell,
    s: r.cell,
  };
}

function arrowOf(bus) {
  if (bus.dy === -1) return '↑';
  if (bus.dy === 1) return '↓';
  if (bus.dx === -1) return '←';
  return '→';
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function easeOut(t) {
  return 1 - (1 - t) * (1 - t);
}

// input.js —— 指针输入：拖动（网格吸附）+ 点击两模式

class Input {
  constructor(canvas, callbacks) {
    this.canvas = canvas;
    this.cb = callbacks; // { onMove(carId, target), onSelect(carId), onDragPreview(carId, target) }
    this.drag = null;
    canvas.style.touchAction = 'none';

    canvas.addEventListener('pointerdown', e => this.down(e));
    canvas.addEventListener('pointermove', e => this.move(e));
    canvas.addEventListener('pointerup', e => this.up(e));
    canvas.addEventListener('pointercancel', e => this.cancel(e));
  }

  down(e) {
    e.preventDefault();
    this.canvas.setPointerCapture(e.pointerId);
    const hit = this.cb.hitTest(e.clientX, e.clientY);
    if (!hit) return;
    const { carId, targets } = hit;
    this.drag = { carId, targets, startX: e.clientX, startY: e.clientY, moved: false };
    this.cb.onSelect(carId);
  }

  move(e) {
    if (!this.drag) return;
    const dx = e.clientX - this.drag.startX;
    const dy = e.clientY - this.drag.startY;
    if (Math.abs(dx) + Math.abs(dy) > 6) this.drag.moved = true;
    const target = this.cb.projectDrag(this.drag.carId, e.clientX, e.clientY, this.drag.targets);
    this.cb.onDragPreview(this.drag.carId, target);
  }

  up(e) {
    if (!this.drag) return;
    const d = this.drag;
    this.drag = null;
    if (d.moved) {
      const target = this.cb.projectDrag(d.carId, e.clientX, e.clientY, d.targets);
      if (target !== null) this.cb.onMove(d.carId, target);
      else this.cb.onDragPreview(d.carId, null);
    } else {
      // 点击模式：点车选中后再点目标格
      const cell = this.cb.cellAt(e.clientX, e.clientY);
      if (cell) this.cb.onTapCell(d.carId, cell);
    }
  }

  cancel() {
    if (this.drag) this.cb.onDragPreview(this.drag.carId, null);
    this.drag = null;
  }
}

// main.js —— 场景状态机 + 游戏循环（v0.2：说明系统 + 星级存档 + 道路选关）







const canvas = document.getElementById('game');
const renderer = new Renderer(canvas);
const ui = {
  title: document.getElementById('title-screen'),
  help: document.getElementById('help-screen'),
  hud: document.getElementById('hud'),
  levelList: document.getElementById('level-list'),

  par: document.getElementById('par'),
  pickupHint: document.getElementById('pickup-hint'),
  hint: document.getElementById('hint'),
  restart: document.getElementById('btn-restart'),
  back: document.getElementById('btn-back'),
  start: document.getElementById('btn-start'),
  helpBtn: document.getElementById('btn-help'),
  helpClose: document.getElementById('btn-help-close'),
  win: document.getElementById('win-screen'),
  winStars: document.getElementById('win-stars'),
  winStats: document.getElementById('win-stats'),
  winText: document.getElementById('win-text'),
  next: document.getElementById('btn-next'),
  back2: document.getElementById('btn-back2'),
};

let game = null;
let screen = 'title';
let lastT = 0;

// ---------- 星级存档 ----------
const store = {
  all() {
    try { return JSON.parse(localStorage.getItem('cl_stars') || '{}'); } catch { return {}; }
  },
  set(id, s) {
    const m = this.all();
    m[id] = Math.max(m[id] || 0, s);
    try { localStorage.setItem('cl_stars', JSON.stringify(m)); } catch {}
  },
};

function setHint(t) {
  ui.hint.textContent = t || '';
  ui.hint.style.display = t ? 'block' : 'none';
}

function startLevel(def) {
  const level = createLevel(def);
  game = {
    def, level,
    state: initialState(level),
    moves: 0,
    selectedId: null,
    anims: {},
    now: performance.now(),
    won: false,
    dragPreview: null,
  };
  screen = 'level';
  ui.title.style.display = 'none';
  ui.help.style.display = 'none';
  ui.win.style.display = 'none';
  ui.hud.style.display = 'grid';
  ui.levelName.textContent = `第 ${def.id} 关 · ${def.name}`;
  ui.quote.textContent = `“${def.quote || ''}”`;
  ui.par.textContent = String(def.par);
  ui.pickupHint.style.display = def.pickups.length ? 'block' : 'none';
  // 情境提示：首关教拖动；捎人关教接人
  if (def.pickups.length) setHint('先开到乘客旁接人，道闸才会抬起');
  else if (def.id === 1 && !(store.all()[1])) setHint('按住红车，向右拖动');
  else setHint(null);
  renderer.resize(level, window.devicePixelRatio || 1);
  updateHud();
}

function updateHud() {
  ui.moves.textContent = String(game.moves);
}

function tryMove(carId, target) {
  const g = game;
  if (g.won) return;
  const targets = slideTargets(g.level, g.state, carId);
  if (!targets.includes(target)) return;
  const before = cloneState(g.state);
  const ns = applyMove(g.level, g.state, carId, target);
  g.state = ns;
  g.moves++;
  g.anims[carId] = { from: { x: before.cars[carId].x, y: before.cars[carId].y }, t0: performance.now(), dur: 130 };
  for (const c of g.level.cars) {
    if (c.bus && (before.cars[c.id].x !== ns.cars[c.id].x || before.cars[c.id].y !== ns.cars[c.id].y)) {
      g.anims[c.id] = { from: { x: before.cars[c.id].x, y: before.cars[c.id].y }, t0: performance.now(), dur: 200 };
    }
  }
  let pickedNow = false;
  for (const p of g.level.pickups) {
    if (ns.picked.includes(p.id) && !before.picked.includes(p.id)) {
      renderer.burst(g.level, p.x, p.y, '#2ecc71');
      pickedNow = true;
    }
  }
  // 提示消除：首关首次移动后 / 接到第一个乘客后
  if (g.def.id === 1) setHint(null);
  if (pickedNow) setHint('道闸开了！开出右出口');
  updateHud();
  if (isWin(g.level, g.state)) onWin();
}

function onWin() {
  const g = game;
  g.won = true;
  setHint(null);
  const gate = { x: Math.max(0, Math.min(g.level.exit.x, g.level.w - 1)), y: g.level.exit.y };
  renderer.burst(g.level, gate.x, gate.y, '#ffd640');
  const stars = g.moves <= g.def.par ? 3 : g.moves <= g.def.par + 2 ? 2 : 1;
  store.set(g.def.id, stars);
  setTimeout(() => {
    ui.win.style.display = 'flex';
    ui.winStars.textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
    ui.winStats.innerHTML = `本局 <b>${g.moves}</b> 步 · 3★ 标杆 <b>${g.def.par}</b> 步`;
    ui.winText.textContent = stars === 3 ? '师傅，稳！' : stars === 2 ? '还行，再抠两步？' : '能出去就行（笑）';
    const hasNext = LEVELS.find(l => l.id === g.def.id + 1);
    ui.next.style.display = hasNext ? 'inline-block' : 'none';
  }, 350);
}

// ---------- 输入回调 ----------
const input = new Input(canvas, {
  hitTest(cx, cy) {
    if (!game || game.won) return null;
    const car = hitCar(cx, cy);
    if (!car || car.bus) return null;
    return { carId: car.id, targets: slideTargets(game.level, game.state, car.id) };
  },
  onSelect(carId) { if (game) game.selectedId = carId; },
  onDragPreview(carId, target) { if (game) game.dragPreview = target === null ? null : { carId, target }; },
  projectDrag(carId, cx, cy, targets) {
    if (!targets.length || !game) return null;
    const car = game.level.cars.find(c => c.id === carId);
    const rect = canvas.getBoundingClientRect();
    const isH = car.dir === 'h';
    const d = isH ? cx - (rect.left + renderer.ox + (game.state.cars[carId].x + car.len / 2) * renderer.cell)
                  : cy - (rect.top + renderer.oy + (game.state.cars[carId].y + car.len / 2) * renderer.cell);
    const delta = Math.round(d / renderer.cell);
    const cur = game.state.cars[carId][isH ? 'x' : 'y'];
    let best = null;
    let bestDist = Infinity;
    for (const t of targets) {
      const dist = Math.abs(t - (cur + delta));
      if (dist < bestDist) { bestDist = dist; best = t; }
    }
    if (best === cur) return null;
    return best;
  },
  onMove(carId, target) {
    tryMove(carId, target);
    if (game) game.dragPreview = null;
  },
  onTapCell(carId, cell) {
    if (!game) return;
    const car = game.level.cars.find(c => c.id === carId);
    const isH = car.dir === 'h';
    const cur = game.state.cars[carId][isH ? 'x' : 'y'];
    const t = isH
      ? (cell.x > cur ? cell.x - car.len + 1 : cell.x)
      : (cell.y > cur ? cell.y - car.len + 1 : cell.y);
    tryMove(carId, t);
  },
  cellAt(cx, cy) { return renderer.posToCell(game.level, cx, cy); },
});

function hitCar(cx, cy) {
  const g = game;
  const cellPos = renderer.posToCell(g.level, cx, cy);
  if (!cellPos.inside) return null;
  const grid = new Map();
  for (const c of g.level.cars) {
    const p = g.state.cars[c.id];
    for (let i = 0; i < c.len; i++) {
      const x = c.dir === 'h' ? p.x + i : p.x;
      const y = c.dir === 'v' ? p.y + i : p.y;
      grid.set(x + ',' + y, c);
    }
  }
  return grid.get(cellPos.x + ',' + cellPos.y) || null;
}

// ---------- UI 绑定 ----------
ui.restart.addEventListener('click', () => game && startLevel(game.def));
ui.back.addEventListener('click', () => { screen = 'title'; showTitle(); });
ui.next.addEventListener('click', () => {
  const nxt = LEVELS.find(l => l.id === game.def.id + 1);
  if (nxt) startLevel(nxt);
});
ui.back2.addEventListener('click', () => { ui.win.style.display = 'none'; });
ui.helpBtn.addEventListener('click', () => { ui.help.style.display = 'flex'; });
ui.helpClose.addEventListener('click', () => { ui.help.style.display = 'none'; });
ui.start.addEventListener('click', () => {
  const stars = store.all();
  const first = LEVELS.find(l => !stars[l.id]) || LEVELS[0];
  startLevel(first);
});

function showTitle() {
  ui.title.style.display = 'flex';
  ui.hud.style.display = 'none';
  ui.win.style.display = 'none';
  ui.help.style.display = 'none';
  setHint(null);
  const stars = store.all();
  ui.levelList.innerHTML = '';
  for (const def of LEVELS) {
    const st = stars[def.id] || 0;
    const btn = document.createElement('button');
    btn.className = 'level-btn';
    btn.innerHTML =
      `<span class="no"><b>${String(def.id).padStart(2, '0')}</b></span>` +
      `<span class="node"></span>` +
      `<span class="nm">${def.name}<br><span class="stars">${st ? '★'.repeat(st) + '☆'.repeat(3 - st) : '　'}</span></span>`;
    btn.addEventListener('click', () => startLevel(def));
    ui.levelList.appendChild(btn);
  }
}

window.addEventListener('resize', () => {
  if (game) renderer.resize(game.level, window.devicePixelRatio || 1);
});

// ---------- 主循环 ----------
function frame(t) {
  const dt = Math.min(50, t - lastT || 16);
  lastT = t;
  if (game && screen === 'level') {
    game.now = t;
    const view = {
      gateOpen: gateOpen(game.level, game.state),
      selectedId: game.selectedId,
      anims: game.anims,
      now: t,
    };
    renderer.draw(game.level, game.state, view, dt);
    if (game.dragPreview) {
      const ctx = renderer.ctx;
      const car = game.level.cars.find(c => c.id === game.dragPreview.carId);
      const isH = car.dir === 'h';
      const px = renderer.ox + (isH ? game.dragPreview.target : game.state.cars[car.id].x) * renderer.cell;
      const py = renderer.oy + (isH ? game.state.cars[car.id].y : game.dragPreview.target) * renderer.cell;
      ctx.strokeStyle = 'rgba(255,184,0,0.6)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.strokeRect(px + 3, py + 3, (isH ? car.len : 1) * renderer.cell - 6, (isH ? 1 : car.len) * renderer.cell - 6);
      ctx.setLineDash([]);
    }
  }
  requestAnimationFrame(frame);
}

showTitle();
requestAnimationFrame(frame);

// 调试钩子（仅 ?debug=1 时暴露）：自动化测试用
if (location.search.includes('debug=1')) {
  window.__CL = {
    levels: LEVELS,
    start: def => startLevel(def),
    get game() { return game; },
    move: (carId, target) => tryMove(carId, target),
  };
}

})();

</script>
